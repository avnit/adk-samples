[project]
name = "auth-provider-demo"
version = "0.1.0"
description = "ADK sample demonstrating 2-legged and 3-legged OAuth2 via a shared auth provider abstraction."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # The core provider library, demo, and tests need only the standard library.
    # google-adk is required only for agent.py (the ADK LlmAgent wiring).
    "google-adk>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# For the notebooks/ production cells (A2A + MCP). The ADK "a2a" and "mcp"
# extras are NOT installed by base google-adk and carry the required pins
# (a2a-sdk>=0.3.4,<2 and mcp>=1.24,<2); a bare `pip install mcp` pulls an
# incompatible 2.x. Install with: pip install ".[notebooks]"
notebooks = [
    "google-adk[a2a,mcp]>=1.0.0",
    "jupyter",
    "nbclient",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["auth_provider_demo"]
